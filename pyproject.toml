[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "deepbluealpha"
version = "0.1.0"
description = "Ethereum whale-flow data for AI agents: Python client, LangChain tools and a Coinbase AgentKit action provider."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Deep Blue Alpha", email = "team@deepbluealpha.io" }]
keywords = ["ethereum", "whale", "on-chain", "crypto", "langchain", "agentkit", "ai-agents", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2", "pydantic>=2"]
agentkit = ["coinbase-agentkit>=0.7", "pydantic>=2", "solana<0.37"]  # solana 0.40 removed solana.rpc.api, which coinbase-agentkit 0.7.4 imports

[project.urls]
Homepage = "https://deepbluealpha.io/mcp"
Source = "https://github.com/DeepBlueAlpha/deepbluealpha-python"
Documentation = "https://deepbluealpha.io/mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/deepbluealpha"]
